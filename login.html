<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Medical Records</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <div class="brand-side">
            <div class="brand-header">
                <span class="brand-logo">🏥</span>
                <span class="brand-name">MedChain Care Hospital</span>
            </div>
            <div class="brand-illustration">🩺</div>
            <h1>Your Health, <br>Securely Connected</h1>
            <p>Access your medical records, book appointments, and connect with doctors — all in one place.</p>
        </div>

        <div class="form-side">
            <div class="login-container">
                <div class="login-icon">🔒</div>
                <h2 id="loginTitle">Patient Login</h2>
                <p class="login-subtitle">Login by filling your details</p>

                <form id="loginForm">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>

                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>

                    <label>Login As</label>
                    <select id="role">
                        <option value="PATIENT">Patient</option>
                        <option value="DOCTOR">Doctor</option>
                        <option value="ADMIN">Admin</option>
                    </select>

                    <button type="submit" id="loginBtn">Login</button>
                    <p id="errorMsg" style="display:none;"></p>
                </form>
            </div>
        </div>
    </div>

    <script src="api-client.js"></script>
    <script>
        const DASHBOARD_BY_ROLE = {
            "PATIENT": "patient-dashboard.html",
            "DOCTOR": "doctor-dashboard.html",
            "ADMIN": "admin-dashboard.html"
        };

        const ROLE_TITLES = {
            "PATIENT": "Patient Login",
            "DOCTOR": "Doctor Login",
            "ADMIN": "Admin Login"
        };

        const roleSelect = document.getElementById("role");
        const loginTitle = document.getElementById("loginTitle");

        roleSelect.addEventListener("change", function () {
            loginTitle.textContent = ROLE_TITLES[roleSelect.value];
        });

        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const role = document.getElementById("role").value;
            const errorMsg = document.getElementById("errorMsg");
            const btn = document.getElementById("loginBtn");
            errorMsg.style.display = "none";
            btn.disabled = true;
            btn.textContent = "Logging in...";
            try {
                const res = await apiLogin(username, password, role);
                localStorage.setItem("mc_token", res.token);
                localStorage.setItem("mc_username", res.username);
                localStorage.setItem("mc_role", res.role);
                localStorage.setItem("mc_fullName", res.fullName || res.username);
                window.location.href = DASHBOARD_BY_ROLE[res.role.toUpperCase()];
            } catch (err) {
                errorMsg.textContent = err.message || "Login failed. Is the backend server running?";
                errorMsg.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Login";
            }
        });
    </script>
</body>
</html>
