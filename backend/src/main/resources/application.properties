server.port=8081
spring.application.name=SecureMedChain

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ─── H2 In-Memory Database ──────────────────────────────
spring.datasource.url=jdbc:h2:mem:securemedchain;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Email SMTP (set spring.mail.enabled=true and fill credentials to activate) ─
spring.mail.enabled=false
spring.mail.from=noreply@securemedchain.io
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your_gmail@gmail.com
# spring.mail.password=your_app_password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ─── SMS Gateway — Fast2SMS (set sms.enabled=true and fill api-key to activate) ─
sms.enabled=false
sms.fast2sms.api-key=
