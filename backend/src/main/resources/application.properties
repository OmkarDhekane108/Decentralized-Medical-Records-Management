spring.application.name=medvault-backend
server.port=${PORT:8081}
# --- Demo database: in-memory H2, resets on every restart ---
spring.datasource.url=jdbc:h2:mem:medvault;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Production database: swap the block above for this once you have a real
#     Postgres instance (Render/Railway/Supabase all give you a connection URL) ---
# spring.datasource.url=${DATABASE_URL}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASSWORD}
# spring.jpa.hibernate.ddl-auto=validate

# --- IPFS node the backend will pin records to ---
ipfs.api-url=${IPFS_API_URL:http://127.0.0.1:5001}



# --- JWT config ---
jwt.secret=your-256-bit-secret-change-this-in-production-xyzabc123
jwt.expiration-ms=86400000


# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=youremail@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio
twilio.account-sid=your_twilio_account_sid
twilio.auth-token=your_twilio_auth_token
twilio.phone-number=+1xxxxxxxxxx
twilio.whatsapp-number=whatsapp:+14155238886

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
