<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Medical Records</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>New Patient Registration</h2>

        <form id="detailsForm">
            <label>Full Name</label>
            <input type="text" id="fullName" required>

            <label>Photo</label>
            <input type="file" id="photo" accept="image/*">
            <img id="photoPreview" style="display:none; width:80px; height:80px; border-radius:50%; margin-top:8px; object-fit:cover;">

            <label>Age</label>
            <input type="number" id="age" required>

            <label>Weight (kg)</label>
            <input type="number" step="0.1" id="weight" required>

            <label>Mobile Number</label>
            <div style="display:flex; gap:8px;">
                <input type="tel" id="mobile" required style="flex:1;">
                <button type="button" id="sendOtpBtn">Send OTP</button>
            </div>

            <div id="otpBlock" style="display:none;">
                <label>Enter OTP</label>
                <input type="text" id="otp" maxlength="6">
                <button type="button" id="verifyOtpBtn">Verify OTP</button>
                <p id="otpMsg" style="font-size: 13px;"></p>
            </div>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Choose Username</label>
            <input type="text" id="username" required>

            <label>Choose Password</label>
            <input type="password" id="password" required minlength="6">

            <button type="submit" id="registerBtn" disabled>Register</button>
            <p id="errorMsg" style="color:red; display:none; margin-top:10px;"></p>
        </form>

        <p style="margin-top:16px;"><a href="login.html">Already have an account? Login</a></p>
    </div>

    <script src="api-client.js"></script>
    <script>
        let mobileVerified = false;
        let photoBase64 = "";

        document.getElementById("photo").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                photoBase64 = reader.result; // data:image/...;base64,....
                const preview = document.getElementById("photoPreview");
                preview.src = photoBase64;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });

        document.getElementById("sendOtpBtn").addEventListener("click", async () => {
            const mobile = document.getElementById("mobile").value.trim();
            const otpMsg = document.getElementById("otpMsg");
            if (!mobile) { alert("Enter mobile number first"); return; }
            try {
                const res = await apiSendOtp(mobile);
                document.getElementById("otpBlock").style.display = "block";
                otpMsg.style.color = "green";
                // DEMO ONLY: showing OTP directly since no SMS gateway is connected yet.
                otpMsg.textContent = "Demo OTP (no SMS gateway yet): " + res.demoOtp;
            } catch (err) {
                alert(err.message || "Failed to send OTP");
            }
        });

        document.getElementById("verifyOtpBtn").addEventListener("click", async () => {
            const mobile = document.getElementById("mobile").value.trim();
            const otp = document.getElementById("otp").value.trim();
            const otpMsg = document.getElementById("otpMsg");
            try {
                await apiVerifyOtp(mobile, otp);
                mobileVerified = true;
                otpMsg.style.color = "green";
                otpMsg.textContent = "Mobile verified ✔";
                document.getElementById("registerBtn").disabled = false;
            } catch (err) {
                otpMsg.style.color = "red";
                otpMsg.textContent = err.message || "Invalid OTP";
            }
        });

        document.getElementById("detailsForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById("errorMsg");
            errorMsg.style.display = "none";

            if (!mobileVerified) {
                errorMsg.textContent = "Please verify your mobile number first.";
                errorMsg.style.display = "block";
                return;
            }

            const payload = {
                username: document.getElementById("username").value.trim(),
                password: document.getElementById("password").value,
                fullName: document.getElementById("fullName").value.trim(),
                age: parseInt(document.getElementById("age").value),
                weight: parseFloat(document.getElementById("weight").value),
                mobile: document.getElementById("mobile").value.trim(),
                email: document.getElementById("email").value.trim(),
                photoBase64: photoBase64,
            };

            try {
                const res = await apiRegister(payload);
                localStorage.setItem("mc_token", res.token);
                localStorage.setItem("mc_username", res.username);
                localStorage.setItem("mc_role", res.role);
                localStorage.setItem("mc_fullName", res.fullName || res.username);
                window.location.href = "patient-dashboard.html";
            } catch (err) {
                errorMsg.textContent = err.message || "Registration failed";
                errorMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
